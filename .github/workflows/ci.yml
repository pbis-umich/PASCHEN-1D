name: PASCHEN-1D release checks

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.lock
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements-dev.lock
      - run: python -m compileall -q *.py tools tests
      - run: python -m pytest -q
      - run: python tools/build_electron_manifest.py --check
      - run: python tools/audit_swarm_data.py
      - run: python tools/build_release_archive.py
      - run: tar -tzf dist/PASCHEN-1D-1.1.0.tar.gz | grep 'electron_swarm_data/manifest.json'
      - run: tar -tzf dist/PASCHEN-1D-1.1.0.tar.gz | grep 'ion_swarm_data/normalized_lxcat_2026-07-21/manifest.json'
      - run: python tools/build_release_wheel.py
      - run: unzip -l dist/paschen_1d-1.1.0-py3-none-any.whl | grep 'electron_swarm_data/manifest.json'
      - run: unzip -l dist/paschen_1d-1.1.0-py3-none-any.whl | grep 'ion_swarm_data/normalized_lxcat_2026-07-21/manifest.json'
